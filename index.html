function save(){saveLocal();queueCloud()}function baseMeals(){return Object.fromEntries(templates.map(t=>[t.id,{active:false,items:Object.fromEntries(t.groups.flatMap(g=>g.items.map(([id,qty,on])=>[id,{qty,on}])))}]))}function getDay(k,create=false){if(!state.days[k]&&create){state.days[k]={meals:baseMeals(),excluded:false,confirmed:false,weights:{morning:null,evening:null},thresholds:thresholdsFor(k),hasFood:false};save()}return state.days[k]||null}
function allWeights(){return Object.entries(state.days).filter(([k,d])=>d.weights&&Number(d.weights.morning)>0).sort((a,b)=>a[0].localeCompare(b[0]))}function recentWeight(k=today()){const w=allWeights().filter(([date])=>date<=k).slice(-7);return w.length?w.reduce((s,[,d])=>s+Number(d.weights.morning),0)/w.length:Number(state.profile.weightCurrent)||60}function maintenance(k=today()){const p=state.profile;if(p.manualMaintenance!==null&&p.manualMaintenance!==''&&Number(p.manualMaintenance)>0)return Number(p.manualMaintenance);const age=Number(k.slice(0,4))-Number(p.birthYear);const sex=p.sex==='male'?5:-161;return Math.round((10*recentWeight(k)+6.25*Number(p.height)-5*age+sex)*Number(p.activity))}function thresholdsFor(k){const settings=[...state.settingsHistory].filter(x=>x.from<=k).sort((a,b)=>a.from.localeCompare(b.from));const setting=settings.length?settings.at(-1):null;return {maintenance:setting?setting.maintenance:maintenance(k),surplus:setting?setting.surplus:Number(state.profile.surplus)}}

function weightUpdate(k,part,v){const d=getDay(k,true);d.weights[part]=v===''?null:clamp(Number(v)||0,0,500);if(part==='morning'&&d.weights[part])state.profile.weightCurrent=d.weights[part];save();render()}
function hero(d,k){const t=d?.thresholds||thresholdsFor(k),n=dayN(d),status=dayStatus(d);return `<section class="panel hero"><div class="eyebrow">${escape(fmtDate(k))}</div><div class="number">${fmt(n.kcal)} <span style="font-size:17px;font-weight:500">kcal</span></div><span class="status ${status}">${dayLabel(status)}</span><div class="progress"><div class="fill ${status==='gray'?'orange':status}" style="width:${clamp(n.kcal/(t.maintenance+t.surplus)*100,0,100)}%"></div></div><div class="triple"><div class="stat"><small>Maintien</small><b>${fmt(t.maintenance)}</b></div><div class="stat"><small>Objectif</small><b>${fmt(t.maintenance+t.surplus)}</b></div><div class="stat"><small>Protéines</small><b>${fmt(n.protein)} g</b></div></div><p class="hint">${n.kcal>=t.maintenance+t.surplus?'Objectif calorique atteint.':`${fmt(Math.max(0,t.maintenance+t.surplus-n.kcal))} kcal avant ton objectif.`} Objectif protéines : ${fmt(recentWeight(k)*state.profile.proteinPerKg)} g.</p></section>`}
function mealCard(t,d){const m=d.meals[t.id],n=mealN(m);return `<article class="panel meal"><div class="mealhead"><div><h3>${t.name}</h3><div class="mealmeta">${t.subtitle}</div><div class="mealmeta">${fmt(n.kcal)} kcal · ${fmt(n.protein)} g de protéines ${m.active?'· ✓ enregistré':''}</div></div><button class="btn ${m.active?'':'secondary'}" data-edit="${t.id}">${m.active?'Modifier':'Composer'}</button></div></article>`}
function weightFields(k,d){return `<div class="weights"><div class="field"><label>Poids du matin (kg)</label><input type="number" step="0.1" min="0" max="500" inputmode="decimal" data-weight="morning" data-date="${k}" value="${d?.weights?.morning??''}" placeholder="Facultatif"></div><div class="field"><label>Poids du soir (kg)</label><input type="number" step="0.1" min="0" max="500" inputmode="decimal" data-weight="evening" data-date="${k}" value="${d?.weights?.evening??''}" placeholder="Facultatif"></div></div><p class="hint">Seules les pesées du matin influencent l'estimation du maintien. Les deux restent dans l'historique.</p>`}
function daily(k=today(),isModal=false){const d=getDay(k,true);return `${hero(d,k)}<section class="panel"><h2>Mes pesées</h2>${weightFields(k,d)}</section><div class="sectionhead"><h2>Mes repas</h2><small>Modifier les quantités, puis enregistrer</small></div>${templates.map(t=>mealCard(t,d)).join('')}<section class="panel"><h2>Ma journée</h2><p class="hint">Les journées avec des repas enregistrés sont comptabilisées automatiquement, même sans confirmation. Exclure une journée la retire uniquement des statistiques alimentaires.</p><div class="actions"><button class="btn" data-confirm="${k}">${d.confirmed?'✓ Journée validée':'Valider ma journée'}</button><button class="btn ${d.excluded?'':'danger'}" data-exclude="${k}">${d.excluded?'Réintégrer la journée':'Ne pas comptabiliser'}</button></div>${d.excluded?'<p class="hint">Journée exclue : les repas et les pesées sont conservés.</p>':''}</section>`}
function monthKeys(){const [y,m]=month.split('-').map(Number);return Array.from({length:new Date(y,m,0).getDate()},(_,i)=>iso(y,m,i+1))}function included(k){const d=state.days[k];return d&&!d.excluded&&d.hasFood}function calendar(){const keys=monthKeys(),dates=keys.filter(included),n=dates.length,avg=n?dates.reduce((a,k)=>a+dayN(state.days[k]).kcal,0)/n:0,protein=n?dates.reduce((a,k)=>a+dayN(state.days[k]).protein,0)/n:0,success=dates.filter(k=>dayStatus(state.days[k])==='green').length;const [y,m]=month.split('-').map(Number);const offset=(new Date(y,m-1,1).getDay()+6)%7;const title=new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return `<section class="panel"><div class="calhead"><button data-month="-1">‹</button><h2 style="margin:0;text-transform:capitalize">${title}</h2><button data-month="1">›</button></div><div class="calendar">${['L','M','M','J','V','S','D'].map(x=>`<div class="weekday">${x}</div>`).join('')}${Array.from({length:offset},()=>'<div class="day empty"></div>').join('')}${keys.map(k=>{const d=state.days[k],s=dayStatus(d);return `<button class="day ${s} ${k===today()?'today':''}" data-date="${k}"><strong>${Number(k.slice(-2))}</strong><span class="k">${d?.hasFood?fmt(dayN(d).kcal):'—'}</span>${d?.confirmed?'<span class="k">✓</span>':''}</button>`}).join('')}</div><div class="legend"><span><i class="dot" style="background:var(--red)"></i>Sous maintien</span><span><i class="dot" style="background:var(--orange)"></i>Surplus partiel</span><span><i class="dot" style="background:var(--green)"></i>Objectif atteint</span><span><i class="dot" style="background:#7b8290"></i>Sans suivi / exclue</span></div></section><section class="panel"><h2>Bilan du mois</h2><div class="grid"><div class="stat"><small>Moyenne calories</small><b>${fmt(avg)} kcal</b></div><div class="stat"><small>Moyenne protéines</small><b>${fmt(protein)} g</b></div><div class="stat"><small>Jours objectif atteint</small><b>${success} / ${n}</b></div><div class="stat"><small>Jours comptabilisés</small><b>${n} / ${keys.length}</b></div></div><p class="hint">Les moyennes excluent les journées sans repas enregistré et celles marquées « Ne pas comptabiliser ».</p></section><section class="panel"><h2>Calories enregistrées</h2>${chart(keys.map(k=>included(k)?dayN(state.days[k]).kcal:null),3000,'kcal')}</section><section class="panel"><h2>Évolution du poids du matin</h2>${chart(keys.map(k=>state.days[k]?.weights?.morning??null),null,'kg')}</section><section class="panel"><h2>Progression vers mon objectif</h2>${goalProgress()}</section>`}
function chart(values,max,unit){const valid=values.filter(v=>v!==null&&Number.isFinite(v));if(!valid.length)return '<p class="hint">Pas encore de données pour cette période.</p>';const hi=max||Math.max(...valid)+Math.max(1,(Math.max(...valid)-Math.min(...valid))*.3),lo=max?0:Math.min(...valid)-Math.max(.5,(Math.max(...valid)-Math.min(...valid))*.3);const pts=values.map((v,i)=>v===null?null:[20+i*660/Math.max(1,values.length-1),160-(v-lo)/Math.max(1,hi-lo)*135]);let segments=[],cur=[];pts.forEach(p=>{if(!p){if(cur.length)segments.push(cur);cur=[]}else cur.push(p)});if(cur.length)segments.push(cur);return `<svg class="chart" viewBox="0 0 700 180" preserveAspectRatio="none" role="img" aria-label="Graphique ${unit}"><line x1="20" y1="160" x2="680" y2="160" stroke="#555e6e"/>${segments.map(s=>`<polyline points="${s.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#9b8cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${s.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#d1c9ff"/>`).join('')}`).join('')}<text x="20" y="15" font-size="13" fill="#abb4c1">${fmt(hi)} ${unit}</text><text x="20" y="177" font-size="13" fill="#abb4c1">${fmt(lo)} ${unit}</text></svg>`}
function goalProgress(){const p=state.profile,w=recentWeight(),start=Number(p.weightStart),goal=Number(p.goal),progress=goal===start?100:clamp((w-start)/(goal-start)*100,0,100);return `<div class="triple"><div class="stat"><small>Départ</small><b>${start} kg</b></div><div class="stat"><small>Actuel*</small><b>${w.toFixed(1)} kg</b></div><div class="stat"><small>Objectif</small><b>${goal} kg</b></div></div><div class="progress"><div class="fill green" style="width:${progress}%"></div></div><p class="hint">${Math.round(progress)} % du chemin · ${Math.max(0,goal-w).toFixed(1)} kg restants. *Moyenne des 7 dernières pesées du matin, ou poids de référence en leur absence.</p>${w>=goal?`<div class="note">Palier atteint ! <button class="btn" data-next-goal>Me proposer ${p.nextGoal} kg</button></div>`:''}`}
function profile(){const p=state.profile;return `<section class="panel"><h2>Ma progression</h2>${goalProgress()}</section><section class="panel"><h2>Mes paramètres</h2><div class="grid"><div class="field"><label>Sexe pour le calcul</label><select data-profile="sex"><option value="male" ${p.sex==='male'?'selected':''}>Homme</option><option value="female" ${p.sex==='female'?'selected':''}>Femme</option></select></div><div class="field"><label>Année de naissance</label><input type="number" data-profile="birthYear" value="${p.birthYear}"></div><div class="field"><label>Taille (cm)</label><input type="number" data-profile="height" value="${p.height}"></div><div class="field"><label>Poids de départ (kg)</label><input type="number" step="0.1" data-profile="weightStart" value="${p.weightStart}"></div><div class="field"><label>Objectif actuel (kg)</label><input type="number" step="0.1" data-profile="goal" value="${p.goal}"></div><div class="field"><label>Objectif suivant (kg)</label><input type="number" step="0.1" data-profile="nextGoal" value="${p.nextGoal}"></div><div class="field"><label>Activité / entraînement</label><select data-profile="activity"><option value="1.375" ${p.activity==1.375?'selected':''}>Légère</option><option value="1.55" ${p.activity==1.55?'selected':''}>Modérée (marche + 5–6 séances)</option><option value="1.725" ${p.activity==1.725?'selected':''}>Élevée</option></select></div><div class="field"><label>Surplus souhaité</label><select data-profile="surplus"><option value="200" ${p.surplus==200?'selected':''}>Progressif (+200)</option><option value="300" ${p.surplus==300?'selected':''}>Modéré (+300)</option><option value="500" ${p.surplus==500?'selected':''}>Rapide (+500)</option></select></div><div class="field"><label>Protéines (g/kg)</label><input type="number" min="1" max="3" step="0.1" data-profile="proteinPerKg" value="${p.proteinPerKg}"></div><div class="field"><label>Maintien manuel (kcal, facultatif)</label><input type="number" min="0" data-profile="manualMaintenance" value="${p.manualMaintenance??''}" placeholder="Automatique"></div></div><button class="btn" id="saveProfile">Enregistrer mes paramètres</button><p class="hint">Le maintien est une estimation (Mifflin-St Jeor × activité). Le poids cible ne modifie pas directement le maintien. Chaque journée conserve ses seuils historiques, même si tu modifies ton profil.</p></section><section class="panel"><h2>Mes objectifs actuels</h2><div class="triple"><div class="stat"><small>Maintien estimé</small><b>${fmt(maintenance())}</b></div><div class="stat"><small>Surplus</small><b>+${p.surplus}</b></div><div class="stat"><small>Cible kcal</small><b>${fmt(maintenance()+Number(p.surplus))}</b></div></div><p class="hint">Cible protéines : ${fmt(recentWeight()*p.proteinPerKg)} g/jour. Les calculs sont indicatifs et peuvent être affinés avec l'évolution du poids sur plusieurs semaines.</p></section><section class="panel"><h2>Mon compte</h2><p class="hint">Connecté avec : <strong>${escape(currentUser?.email||'')}</strong></p><button class="btn secondary" id="profileLogout">Changer de compte / Déconnexion</button></section><section class="panel"><h2>Données</h2><div class="actions"><button class="btn secondary" id="export">Exporter mes données JSON</button><label class="btn secondary" style="cursor:pointer">Importer JSON<input type="file" id="import" accept="application/json" hidden></label></div><p class="hint">Les données sont synchronisées avec ton compte Supabase lorsque la connexion est disponible. Tu peux aussi exporter une sauvegarde JSON.</p></section>`}
function render(){const k=today();$('#headDate').textContent=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'short'});$('#app').innerHTML=tab==='today'?daily(k):tab==='calendar'?calendar():profile();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.body.className=tab==='today'?dayStatus(getDay(k)):'gray'}
function openMeal(id,k){const d=getDay(k,true),t=templates.find(x=>x.id===id),m=d.meals[id];editing={id,k,active:m.active,items:JSON.parse(JSON.stringify(m.items))};const rows=t.groups.map(g=>`<h3 style="margin:18px 0 8px">${g.name}</h3><div class="items">${g.items.map(([food])=>{const obj=editing.items[food],f=foods[food];return `<div class="item"><input type="checkbox" data-food-check="${food}" ${obj.on?'checked':''}><label>${f[0]}<small>${fmt(itemN(food,obj).kcal)} kcal</small></label><input type="number" min="0" step="1" data-food-qty="${food}" value="${Number(obj.qty)>0?obj.qty:''}" inputmode="decimal" placeholder="0"><span class="unit">${f[3]}</span></div>`}).join('')}</div>`).join('');$('#modalContent').innerHTML=`<div class="modalbar"><h2 style="margin:0">${t.name}</h2><button class="btn secondary" data-close>Fermer</button></div><p class="hint">Modifie les quantités, coche les ingrédients consommés, puis enregistre. Les aliments à 0 g ne sont pas comptés.</p>${rows}<div class="panel" style="margin-top:18px"><strong id="mealTotal"></strong></div><div class="actions"><button class="btn" id="mealSave">Enregistrer ce repas</button><button class="btn secondary" id="mealClear">Retirer ce repas de la journée</button></div>`;$('#modal').classList.remove('hide');updateMealPreview()}
function updateMealPreview(){if(!editing)return;const x=mealN({active:true,items:editing.items});$('#mealTotal').textContent=`${fmt(x.kcal)} kcal · ${fmt(x.protein)} g de protéines`}
function closeModal(){$('#modal').classList.add('hide');editing=null;render()}
function saveMeal(clear=false){const d=getDay(editing.k,true),m=d.meals[editing.id];m.items=editing.items;m.active=!clear;d.hasFood=Object.values(d.meals).some(x=>x.active);d.confirmed=false;save();closeModal()}
function openDay(k){getDay(k,true);$('#modalContent').innerHTML=`<div class="modalbar"><h2 style="margin:0;text-transform:capitalize">${fmtDate(k)}</h2><button class="btn secondary" data-close>Fermer</button></div><div id="dayDetails">${daily(k,true)}</div>`;$('#modal').classList.remove('hide')}
function shiftMonth(n){const [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=iso(d.getFullYear(),d.getMonth()+1,1).slice(0,7);render()}
function updateProfile(){const p=state.profile;document.querySelectorAll('[data-profile]').forEach(el=>{const key=el.dataset.profile;if(key==='sex')p[key]=el.value;else if(key==='manualMaintenance')p[key]=el.value===''?null:Math.max(0,Number(el.value));else p[key]=Number(el.value)});p.height=clamp(p.height,100,250);p.birthYear=clamp(p.birthYear,1900,new Date().getFullYear());p.goal=clamp(p.goal,20,300);p.nextGoal=clamp(p.nextGoal,20,300);p.weightStart=clamp(p.weightStart,20,300);p.proteinPerKg=clamp(p.proteinPerKg,1,3);state.settingsHistory.push({from:today(),maintenance:maintenance(),surplus:p.surplus});state.settingsHistory=state.settingsHistory.filter((x,i,a)=>i===a.findLastIndex(y=>y.from===x.from));const d=getDay(today());if(d)d.thresholds={maintenance:maintenance(),surplus:p.surplus};save();render();alert('Profil enregistré. Les anciens jours conservent leurs seuils.')}
function goalNext(){const p=state.profile;if(confirm(`Passer de ${p.goal} kg à ${p.nextGoal} kg ?`)){p.goal=p.nextGoal;p.nextGoal=p.goal+5;save();render()}}
function download(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='mes-calories-sauvegarde-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.edit){const k=$('#modal').classList.contains('hide')?today():$('#modalContent [data-weight]')?.dataset.date||today();openMeal(b.dataset.edit,k)}else if(b.dataset.close!==undefined)closeModal();else if(b.dataset.month)shiftMonth(Number(b.dataset.month));else if(b.dataset.date)openDay(b.dataset.date);else if(b.dataset.confirm){const d=getDay(b.dataset.confirm,true);d.confirmed=true;d.excluded=false;save();if(!$('#modal').classList.contains('hide'))openDay(b.dataset.confirm);else render()}else if(b.dataset.exclude){const d=getDay(b.dataset.exclude,true);d.excluded=!d.excluded;if(d.excluded)d.confirmed=false;save();if(!$('#modal').classList.contains('hide'))openDay(b.dataset.exclude);else render()}else if(b.id==='mealSave')saveMeal();else if(b.id==='mealClear')saveMeal(true);else if(b.id==='saveProfile')updateProfile();else if(b.id==='profileLogout')$('#logout').click();else if(b.id==='export')download();else if(b.dataset.nextGoal!==undefined)goalNext()});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.weight){weightUpdate(el.dataset.date,el.dataset.weight,el.value);if(!$('#modal').classList.contains('hide'))openDay(el.dataset.date)}else if(el.dataset.foodCheck&&editing){editing.items[el.dataset.foodCheck].on=el.checked;updateMealPreview()}else if(el.id==='import'){const file=el.files?.[0];if(!file)return;file.text().then(txt=>{const data=JSON.parse(txt);if(!data.days||!data.profile)throw Error('Format invalide');if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){state=data;state.profile={...defaultProfile,...state.profile};state.settingsHistory=state.settingsHistory||[];save();render()}}).catch(()=>alert('Impossible de lire ce fichier JSON.'))}});
document.addEventListener('focusin',e=>{const el=e.target;if(el.matches('input[type=number]')){el.select();el.setAttribute('inputmode','decimal')}});
 document.addEventListener('input',e=>{const el=e.target;if(el.dataset.foodQty&&editing){const obj=editing.items[el.dataset.foodQty];obj.qty=Math.max(0,Number(el.value)||0);obj.on=obj.qty>0;const check=$(`[data-food-check="${el.dataset.foodQty}"]`);if(check)check.checked=obj.on;updateMealPreview()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;const email=$('#authEmail').value.trim(),password=$('#authPassword').value;$('#authSubmit').disabled=true;$('#authMessage').textContent='Un instant…';try{let result;if(authMode==='register'){result=await client.auth.signUp({email,password,options:{emailRedirectTo:SITE_URL}});if(result.error)throw result.error;$('#authMessage').textContent=result.data.session?'Compte créé. Connexion…':'Compte créé ! Vérifie ta boîte mail et clique sur le lien de confirmation.'}else if(authMode==='login'){result=await client.auth.signInWithPassword({email,password});if(result.error)throw result.error;$('#authMessage').textContent='Connexion…'}else if(authMode==='reset'){result=await client.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});if(result.error)throw result.error;$('#authMessage').textContent='Si cette adresse existe, un e-mail de réinitialisation a été envoyé.'}else if(authMode==='newpass'){result=await client.auth.updateUser({password});if(result.error)throw result.error;$('#authMessage').textContent='Mot de passe modifié.';setAuthMode('login');await client.auth.signOut()}}catch(err){$('#authMessage').textContent=authError(err)}finally{$('#authSubmit').disabled=false}});
$('#switchAuth').addEventListener('click',()=>setAuthMode(authMode==='login'?'register':'login'));
$('#resetAuth').addEventListener('click',()=>setAuthMode('reset'));
$('#logout').addEventListener('click',async()=>{if(pendingSync){await flushCloud();if(pendingSync){alert('La sauvegarde cloud n’est pas terminée. Réessaie quand la synchronisation sera rétablie.');return}}await client.auth.signOut({scope:'local'})});
window.addEventListener('online',()=>{if(pendingSync)flushCloud()});
initAuth();setInterval(()=>{if(tab==='today'&&$('#modal').classList.contains('hide'))render()},60000);
})();</script></body></html>
