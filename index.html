<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes calories</title>
<style>
:root{
  --bg:#10131a;--panel:#1b202a;--panel2:#272d39;
  --text:#f4f5f8;--muted:#aeb6c5;--line:#394150;
  --accent:#a99aff;--red:#e56c74;--orange:#edac54;
  --green:#58c69b
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,Arial,sans-serif;
  transition:background .3s
}
body.red{background:linear-gradient(#382027,#10131a 430px)}
body.orange{background:linear-gradient(#3a2e20,#10131a 430px)}
body.green{background:linear-gradient(#193a30,#10131a 430px)}
button,input,select{font:inherit}
button{cursor:pointer}
main{max-width:920px;margin:auto;padding:22px 15px 110px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:27px;margin:3px 0}
h2{font-size:20px;margin:0 0 15px}
h3{font-size:16px;margin:0}
p{line-height:1.5}
small,.muted{color:var(--muted)}
small{font-size:12px}
.panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:17px;margin-bottom:14px
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel2);padding:12px;border-radius:12px}
.stat b{display:block;font-size:21px;margin-top:5px}
.hero-number{font-size:40px;font-weight:800}
.progress{height:12px;background:#343b47;border-radius:20px;overflow:hidden;margin:13px 0}
.fill{height:100%;transition:width .3s}
.fill.red{background:var(--red)}
.fill.orange{background:var(--orange)}
.fill.green{background:var(--green)}
.badge{display:inline-block;padding:5px 10px;border-radius:30px;font-size:12px;font-weight:700}
.badge.red{background:#63313b;color:#ffd7dc}
.badge.orange{background:#654c2a;color:#ffe2b5}
.badge.green{background:#255541;color:#d4ffeb}
.badge.gray{background:#424956;color:#e2e5ed}
.btn{
  border:0;background:var(--accent);color:#15131d;
  border-radius:11px;padding:11px 14px;font-weight:750
}
.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#57333c;color:#ffdade}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.nav{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:center;z-index:5;
  background:#171c26f2;border-top:1px solid var(--line);
  padding:10px 8px max(12px,env(safe-area-inset-bottom))
}
.nav button{
  width:min(33%,220px);background:none;border:0;
  color:var(--muted);padding:11px 4px;border-radius:10px;font-size:13px
}
.nav button.active{background:var(--panel2);color:white;font-weight:700}
.meal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meal-head p{margin:5px 0;color:var(--muted);font-size:13px}
input[type=number],input[type=date],select{
  width:100%;min-width:0;background:#11151d;color:white;
  border:1px solid #4a5362;border-radius:9px;padding:10px
}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.items{display:grid;gap:8px;margin:15px 0}
.item{
  display:grid;grid-template-columns:24px minmax(0,1fr) 75px 30px;
  align-items:center;gap:8px;background:var(--panel2);
  border-radius:10px;padding:9px
}
.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}
.item input[type=number]{padding:8px 5px;text-align:right}
.item label{font-size:13px}
.item small{display:block;margin-top:4px}
.weights{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:15px}
.weekday{text-align:center;font-size:12px;color:var(--muted)}
.day{
  border:1px solid var(--line);background:var(--panel2);
  color:white;border-radius:10px;min-height:68px;
  padding:7px 2px;display:flex;flex-direction:column;
  align-items:center;gap:5px
}
.day.red{background:#512c35}
.day.orange{background:#59432a}
.day.green{background:#24513f}
.day.gray{background:#2b303a}
.day.today{outline:2px solid var(--accent)}
.day.empty{border:0;background:transparent}
.day small{font-size:10px;color:#e4e6ed}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:15px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.modal{
  position:fixed;inset:0;background:#000b;z-index:10;
  display:flex;justify-content:center;align-items:flex-end
}
.modal-inner{
  background:var(--panel);width:min(100%,760px);
  max-height:92vh;overflow:auto;padding:20px;
  border-radius:20px 20px 0 0;border:1px solid var(--line)
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.hidden{display:none!important}
.chart{width:100%;height:180px}
.note{padding:12px;background:var(--panel2);border-radius:10px;font-size:13px;color:var(--muted)}
@media(min-width:650px){
  .modal{align-items:center}
  .modal-inner{border-radius:20px}
  .day{min-height:82px}
}
@media(max-width:400px){
  .item{grid-template-columns:22px minmax(0,1fr) 62px 22px;gap:5px}
  .item label{font-size:12px}
  .three .stat{padding:8px}
  .three .stat b{font-size:16px}
  .day{min-height:60px}
  .day small{font-size:9px}
}
</style>
</head>
<body>
<main>
<header>
  <div>
    <small>Suivi alimentaire</small>
    <h1>Mes calories</h1>
  </div>
  <span id="headerDate" class="muted"></span>
</header>
<div id="app"></div>
</main>

<nav class="nav">
  <button data-tab="today" class="active">◉ Ma journée</button>
  <button data-tab="calendar">▦ Calendrier</button>
  <button data-tab="profile">♙ Mon profil</button>
</nav>

<div id="modal" class="modal hidden">
  <div id="modalContent" class="modal-inner"></div>
</div>

<script>
(()=>{
"use strict";

const KEY="mes-calories-v6";
const $=s=>document.querySelector(s);
const money=n=>Math.round(n).toLocaleString("fr-FR");
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const today=()=>{
 const d=new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const dateText=k=>new Date(k+"T12:00:00").toLocaleDateString("fr-FR",{
 weekday:"long",day:"numeric",month:"long",year:"numeric"
});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

const foods={
 bread:["Pain de mie",265,9,"g"],
 pb:["Beurre de cacahuète",600,25,"g"],
 honey:["Miel",304,.3,"g"],
 oats:["Flocons d'avoine",389,16.9,"g"],
 almonds:["Amandes",579,21.2,"g"],
 milk:["Lait",47,3.3,"ml"],
 riceC:["Riz cantonais cuit",180,5,"g"],
 riceT:["Riz thaï cuit nature",130,2.7,"g"],
 chicken:["Boulettes de poulet",200,17,"g"],
 cheddar:["Cheddar",400,25,"g"],
 butter:["Beurre",717,.9,"g"],
 eggs:["Œufs",143,12.6,"g"],
 tuna:["Thon",116,25,"g"],
 banana:["Banane",89,1.1,"g"],
 whey:["Whey personnelle",356,86.67,"g"]
};

// Pain : 30 g par tranche
// Cheddar : 20 g par tranche
// Oeuf : 50 g par unité
// Banane : 120 g de chair

const templates=[
 {id:"breakfast",name:"Petit-déjeuner",
 subtitle:"Tartines et/ou shaker du matin",
 groups:[
  {name:"Tartines",items:[
   ["bread",60,true],["pb",5,true],
   ["honey",7,true],["butter",0,false]
  ]},
  {name:"Shaker du matin",items:[
   ["oats",30,false],["almonds",30,false],
   ["honey",7,false],["pb",5,false],
   ["milk",100,false]
  ]}
 ]},
 {id:"lunch",name:"Déjeuner",
 subtitle:"Riz, boulettes et cheddar",
 groups:[{name:"Assiette",items:[
  ["riceC",200,true],["riceT",0,false],
  ["chicken",35,true],["cheddar",20,true],
  ["butter",10,true]
 ]}]},
 {id:"omelet1",name:"Omelette n°1",
 subtitle:"3 œufs, thon, cheddar et beurre",
 groups:[{name:"Omelette",items:[
  ["eggs",150,true],["tuna",30,true],
  ["cheddar",20,true],["butter",10,true]
 ]}]},
 {id:"snack",name:"Collation",
 subtitle:"Banane",
 groups:[{name:"Collation",items:[
  ["banana",120,true]
 ]}]},
 {id:"dinner",name:"Dîner",
 subtitle:"Riz, boulettes et cheddar",
 groups:[{name:"Assiette",items:[
  ["riceC",200,true],["riceT",0,false],
  ["chicken",35,true],["cheddar",20,true],
  ["butter",10,true]
 ]}]},
 {id:"omelet2",name:"Omelette n°2",
 subtitle:"3 œufs, thon, cheddar et beurre",
 groups:[{name:"Omelette",items:[
  ["eggs",150,true],["tuna",30,true],
  ["cheddar",20,true],["butter",10,true]
 ]}]},
 {id:"evening",name:"Shaker du soir",
 subtitle:"Tous les ingrédients modifiables",
 groups:[{name:"Shaker",items:[
  ["oats",60,true],["almonds",30,true],
  ["pb",15,true],["banana",120,true],
  ["honey",7,true],["milk",200,true],
  ["whey",30,true]
 ]}]}
];

const defaults={
 sex:"male",birthYear:2004,height:175,
 activity:1.55,weightStart:60,
 goal:70,nextGoal:75,
 surplus:300,proteinPerKg:2,
 manualMaintenance:null
};

let state;
try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch{}
if(!state||!state.days){
 state={profile:{...defaults},days:{},settingsHistory:[]};
}
state.profile={...defaults,...state.profile};
state.settingsHistory=state.settingsHistory||[];

let tab="today";
let month=today().slice(0,7);
let editing=null;

function save(){
 try{localStorage.setItem(KEY,JSON.stringify(state))}
 catch(e){alert("Impossible d'enregistrer les données dans ce navigateur.")}
}

function baseMeals(){
 return Object.fromEntries(templates.map(t=>[
  t.id,{
   active:false,
   items:Object.fromEntries(
    t.groups.flatMap(g=>g.items).map(([id,qty,on])=>[
     id,{qty,on}
    ])
   )
  }
 ]));
}

function recentWeight(at=today()){
 const values=Object.entries(state.days)
  .filter(([k,d])=>k<=at&&Number(d.morning)>0)
  .sort((a,b)=>b[0].localeCompare(a[0]))
  .slice(0,7)
  .map(([,d])=>Number(d.morning));
 if(!values.length)return Number(state.profile.weightStart);
 return values.reduce((a,b)=>a+b,0)/values.length;
}

function maintenance(at=today()){
 const p=state.profile;
 if(p.manualMaintenance!==null&&Number(p.manualMaintenance)>0)
  return Number(p.manualMaintenance);
 const weight=recentWeight(at);
 const age=new Date(at+"T12:00:00").getFullYear()-p.birthYear;
 const bmr=10*weight+6.25*p.height-5*age+(p.sex==="male"?5:-161);
 return Math.round(bmr*Number(p.activity));
}

function settingsFor(k){
 const d=state.days[k];
 if(d?.thresholds)return d.thresholds;
 const history=state.settingsHistory
  .filter(x=>x.from<=k)
  .sort((a,b)=>b.from.localeCompare(a.from));
 if(history.length)
  return {maintenance:history[0].maintenance,surplus:history[0].surplus};
 return {maintenance:maintenance(k),surplus:Number(state.profile.surplus)};
}

function getDay(k,create=false){
 if(!state.days[k]&&create){
  state.days[k]={
   meals:baseMeals(),
   morning:null,evening:null,
   excluded:false,confirmed:false,
   thresholds:{
    maintenance:maintenance(k),
    surplus:Number(state.profile.surplus)
   }
  };
  save();
 }
 return state.days[k]||null;
}

function foodValues(id,obj){
 if(!obj||!obj.on)return {kcal:0,protein:0};
 const f=foods[id];
 const q=Math.max(0,Number(obj.qty)||0);
 return {kcal:q*f[1]/100,protein:q*f[2]/100};
}

function mealValues(meal){
 if(!meal||!meal.active)return {kcal:0,protein:0};
 return Object.entries(meal.items).reduce((a,[id,obj])=>{
  const v=foodValues(id,obj);
  a.kcal+=v.kcal;
  a.protein+=v.protein;
  return a;
 },{kcal:0,protein:0});
}

function dayValues(d){
 if(!d)return {kcal:0,protein:0};
 return Object.values(d.meals).reduce((a,m)=>{
  const v=mealValues(m);
  a.kcal+=v.kcal;
  a.protein+=v.protein;
  return a;
 },{kcal:0,protein:0});
}

function status(k,d){
 if(!d||d.excluded)return "gray";
 const kcal=dayValues(d).kcal;
 const s=settingsFor(k);
 if(kcal<s.maintenance)return "red";
 if(kcal<s.maintenance+Number(s.surplus))return "orange";
 return "green";
}

function statusText(s){
 return {
  red:"Sous ton maintien",
  orange:"Maintien atteint — surplus en cours",
  green:"Objectif de surplus atteint",
  gray:"Journée non comptabilisée"
 }[s];
}

function mealCard(t,d,k){
 const m=d?.meals?.[t.id];
 const v=mealValues(m);
 return `<section class="panel">
  <div class="meal-head">
   <div>
    <h3>${t.name}</h3>
    <p>${t.subtitle}</p>
    <small>${m?.active?`${money(v.kcal)} kcal · ${money(v.protein)} g protéines`:"Non enregistré"}</small>
   </div>
   <button class="btn ${m?.active?"secondary":""}"
    data-edit="${t.id}" data-key="${k}">
    ${m?.active?"Modifier":"Ajouter"}
   </button>
  </div>
 </section>`;
}

function weightFields(k,d){
 return `<div class="weights">
  <div class="field">
   <label>Poids du matin (kg)</label>
   <input type="number" min="20" max="300" step="0.1"
    data-weight="morning" data-key="${k}"
    value="${d?.morning??""}" placeholder="Facultatif">
  </div>
  <div class="field">
   <label>Poids du soir (kg)</label>
   <input type="number" min="20" max="300" step="0.1"
    data-weight="evening" data-key="${k}"
    value="${d?.evening??""}" placeholder="Facultatif">
  </div>
 </div>`;
}

function daily(k,inModal=false){
 const d=getDay(k);
 const v=dayValues(d);
 const s=settingsFor(k);
 const target=s.maintenance+Number(s.surplus);
 const st=status(k,d);
 const proteinGoal=recentWeight(k)*state.profile.proteinPerKg;
 const percent=clamp(v.kcal/target*100,0,100);
 return `
 <section class="panel">
  <small>${inModal?"Historique":"Aujourd'hui"}</small>
  <h2 style="text-transform:capitalize;margin-top:5px">${dateText(k)}</h2>
  <div class="hero-number">${money(v.kcal)} <small>kcal</small></div>
  <span class="badge ${st}">${statusText(st)}</span>
  <div class="progress">
   <div class="fill ${st==="gray"?"red":st}"
    style="width:${percent}%"></div>
  </div>
  <div class="three">
   <div class="stat"><small>Maintien</small><b>${money(s.maintenance)}</b></div>
   <div class="stat"><small>Objectif</small><b>${money(target)}</b></div>
   <div class="stat"><small>Écart</small><b>${v.kcal>=target?"+":""}${money(v.kcal-target)}</b></div>
  </div>
  <p class="muted">${money(v.protein)} / ${money(proteinGoal)} g de protéines</p>
  ${d?.confirmed?'<span class="badge green">Journée validée</span>':""}
  ${d?.excluded?'<p class="muted">Cette journée est exclue des statistiques nutritionnelles.</p>':""}
 </section>
 <section class="panel">
  <h2>Mon poids</h2>
  ${weightFields(k,d)}
  <small>Seul le poids du matin sert au calcul des besoins.</small>
 </section>
 <div style="margin:22px 0 12px"><h2>Mes repas</h2></div>
 ${templates.map(t=>mealCard(t,d,k)).join("")}
 <section class="panel">
  <h2>Suivi de la journée</h2>
  <p class="muted">Les journées sont comptabilisées automatiquement, sauf si tu choisis de les exclure.</p>
  <div class="actions">
   <button class="btn" data-confirm="${k}">Valider ma journée</button>
   <button class="btn ${d?.excluded?"secondary":"danger"}"
    data-exclude="${k}">
    ${d?.excluded?"Recomptabiliser":"Ne pas comptabiliser"}
   </button>
  </div>
  <p><small>Tu peux toujours revenir modifier une journée depuis le calendrier.</small></p>
 </section>`;
}

function calendar(){
 const [year,mon]=month.split("-").map(Number);
 const first=new Date(year,mon-1,1);
 const count=new Date(year,mon,0).getDate();
 const offset=(first.getDay()+6)%7;
 const cells=Array(offset).fill('<div class="day empty"></div>');
 const totals=[];
 const protein=[];
 let green=0;
 for(let n=1;n<=count;n++){
  const k=`${year}-${String(mon).padStart(2,"0")}-${String(n).padStart(2,"0")}`;
  const d=getDay(k);
  const st=status(k,d);
  const v=dayValues(d);
  if(d&&!d.excluded){
   totals.push(v.kcal);
   protein.push(v.protein);
   if(st==="green")green++;
  }
  cells.push(`<button class="day ${st} ${k===today()?"today":""}"
   data-date="${k}">
   <b>${n}</b>
   <small>${d&&!d.excluded?money(v.kcal):"—"}</small>
   ${d?.confirmed?"<small>✓</small>":""}
  </button>`);
 }
 const avg=a=>a.length?money(a.reduce((x,y)=>x+y,0)/a.length):"—";
 const prev=new Date(year,mon-2,1);
 const next=new Date(year,mon,1);
 const title=first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
 return `<section class="panel">
  <div class="meal-head">
   <button class="btn secondary" data-month="-1">‹</button>
   <h2 style="margin:0;text-transform:capitalize">${title}</h2>
   <button class="btn secondary" data-month="1">›</button>
  </div>
  <div class="calendar">
   ${["L","M","M","J","V","S","D"].map(x=>`<div class="weekday">${x}</div>`).join("")}
   ${cells.join("")}
  </div>
  <div class="legend">
   <span><i class="dot" style="background:var(--red)"></i>Sous maintien</span>
   <span><i class="dot" style="background:var(--orange)"></i>Surplus partiel</span>
   <span><i class="dot" style="background:var(--green)"></i>Objectif atteint</span>
   <span><i class="dot" style="background:gray"></i>Exclue / sans données</span>
  </div>
 </section>
 <section class="panel">
  <h2>Bilan du mois</h2>
  <div class="grid">
   <div class="stat"><small>Moyenne calories</small><b>${avg(totals)}</b></div>
   <div class="stat"><small>Moyenne protéines</small><b>${avg(protein)} g</b></div>
   <div class="stat"><small>Jours verts</small><b>${green}</b></div>
   <div class="stat"><small>Jours comptabilisés</small><b>${totals.length}</b></div>
  </div>
  <p><small>Les journées exclues ne participent pas aux moyennes.</small></p>
 </section>
 <section class="panel">
  <h2>Évolution des calories</h2>
  ${chart("calories",year,mon)}
 </section>
 <section class="panel">
  <h2>Évolution du poids</h2>
  ${chart("weight",year,mon)}
 </section>`;
}

function chart(type,year,mon){
 const count=new Date(year,mon,0).getDate();
 const values=[];
 for(let i=1;i<=count;i++){
  const k=`${year}-${String(mon).padStart(2,"0")}-${String(i).padStart(2,"0")}`;
  const d=getDay(k);
  let v=null;
  if(type==="weight"){
   if(Number(d?.morning)>0)v=Number(d.morning);
  }else if(d&&!d.excluded){
   v=dayValues(d).kcal;
  }
  values.push(v);
 }
 const available=values.filter(v=>v!==null);
 if(!available.length)return '<p class="muted">Pas encore de données.</p>';
 const min=Math.min(...available);
 const max=Math.max(...available);
 const range=Math.max(max-min,type==="weight"?0.5:200);
 const width=600,height=180,pad=20;
 const coords=values.map((v,i)=>v===null?null:[
  pad+i/(count-1)*(width-2*pad),
  height-pad-(v-min)/range*(height-2*pad)
 ]);
 let lines="";
 let previous=null;
 coords.forEach(p=>{
  if(p&&previous){
   lines+=`<line x1="${previous[0]}" y1="${previous[1]}"
    x2="${p[0]}" y2="${p[1]}"
    stroke="#a99aff" stroke-width="3"/>`;
  }
  previous=p;
 });
 const dots=coords.filter(Boolean).map(p=>
  `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#a99aff"/>`
 ).join("");
 return `<svg class="chart" viewBox="0 0 600 180"
  role="img" aria-label="Graphique ${type}">
  <line x1="20" y1="160" x2="580" y2="160" stroke="#596170"/>
  ${lines}${dots}
 </svg>
 <small>Min : ${money(min)} · Max : ${money(max)}
 ${type==="weight"?"kg":"kcal"}</small>`;
}

function progress(){
 const p=state.profile;
 const w=recentWeight();
 const distance=p.goal-p.weightStart;
 const pct=distance>0?clamp((w-p.weightStart)/distance*100,0,100):100;
 return `<div class="three">
  <div class="stat"><small>Départ</small><b>${p.weightStart} kg</b></div>
  <div class="stat"><small>Actuel*</small><b>${w.toFixed(1)} kg</b></div>
  <div class="stat"><small>Objectif</small><b>${p.goal} kg</b></div>
 </div>
 <div class="progress"><div class="fill green" style="width:${pct}%"></div></div>
 <p class="muted">${pct.toFixed(0)} % du chemin · ${Math.max(0,p.goal-w).toFixed(1)} kg restants</p>
 <small>* Moyenne des 7 dernières pesées du matin enregistrées.</small>
 ${w>=p.goal?`<p><button class="btn" id="nextGoal">Passer à ${p.nextGoal} kg</button></p>`:""}`;
}

function profile(){
 const p=state.profile;
 return `<section class="panel">
  <h2>Ma progression</h2>${progress()}
 </section>
 <section class="panel">
  <h2>Mes paramètres</h2>
  <div class="grid">
   <div class="field"><label>Sexe</label>
    <select data-profile="sex">
     <option value="male" ${p.sex==="male"?"selected":""}>Homme</option>
     <option value="female" ${p.sex==="female"?"selected":""}>Femme</option>
    </select>
   </div>
   <div class="field"><label>Année de naissance</label>
    <input type="number" data-profile="birthYear" value="${p.birthYear}">
   </div>
   <div class="field"><label>Taille (cm)</label>
    <input type="number" data-profile="height" value="${p.height}">
   </div>
   <div class="field"><label>Poids de départ</label>
    <input type="number" step="0.1" data-profile="weightStart" value="${p.weightStart}">
   </div>
   <div class="field"><label>Objectif actuel</label>
    <input type="number" step="0.1" data-profile="goal" value="${p.goal}">
   </div>
   <div class="field"><label>Objectif suivant</label>
    <input type="number" step="0.1" data-profile="nextGoal" value="${p.nextGoal}">
   </div>
   <div class="field"><label>Activité</label>
    <select data-profile="activity">
     <option value="1.375" ${p.activity==1.375?"selected":""}>Légère</option>
     <option value="1.55" ${p.activity==1.55?"selected":""}>Modérée — marche et musculation</option>
     <option value="1.725" ${p.activity==1.725?"selected":""}>Élevée</option>
    </select>
   </div>
   <div class="field"><label>Mode de surplus</label>
    <select data-profile="surplus">
     <option value="200" ${p.surplus==200?"selected":""}>Progressif +200</option>
     <option value="300" ${p.surplus==300?"selected":""}>Modéré +300</option>
     <option value="500" ${p.surplus==500?"selected":""}>Rapide +500</option>
    </select>
   </div>
   <div class="field"><label>Protéines (g/kg)</label>
    <input type="number" step="0.1" min="1" max="3"
     data-profile="proteinPerKg" value="${p.proteinPerKg}">
   </div>
   <div class="field"><label>Maintien manuel (facultatif)</label>
    <input type="number" data-profile="manualMaintenance"
     value="${p.manualMaintenance??""}" placeholder="Automatique">
   </div>
  </div>
  <button class="btn" id="saveProfile">Enregistrer mes paramètres</button>
  <p><small>Le maintien est estimé à partir du poids, de la taille, de l'âge et de l'activité. Il ne s'agit pas d'une mesure exacte.</small></p>
 </section>
 <section class="panel">
  <h2>Mes objectifs nutritionnels</h2>
  <div class="three">
   <div class="stat"><small>Maintien</small><b>${money(maintenance())}</b></div>
   <div class="stat"><small>Surplus</small><b>+${p.surplus}</b></div>
   <div class="stat"><small>Cible</small><b>${money(maintenance()+Number(p.surplus))}</b></div>
  </div>
  <p class="muted">Protéines : ${money(recentWeight()*p.proteinPerKg)} g/jour</p>
 </section>
 <section class="panel">
  <h2>Sauvegarde</h2>
  <div class="actions">
   <button class="btn secondary" id="export">Exporter JSON</button>
   <label class="btn secondary" style="cursor:pointer">
    Importer JSON
    <input type="file" id="import" accept="application/json" hidden>
   </label>
  </div>
  <p><small>Les données sont enregistrées sur cet appareil. Pense à exporter une sauvegarde régulièrement.</small></p>
 </section>`;
}

function render(){
 $("#headerDate").textContent=new Date().toLocaleDateString("fr-FR",{
  day:"numeric",month:"short"
 });
 $("#app").innerHTML=tab==="today"?daily(today()):
  tab==="calendar"?calendar():profile();
 document.querySelectorAll("[data-tab]").forEach(b=>{
  b.classList.toggle("active",b.dataset.tab===tab);
 });
 document.body.className=tab==="today"?status(today(),getDay(today())):"";
}

function openMeal(id,k){
 const d=getDay(k,true);
 const t=templates.find(x=>x.id===id);
 const m=d.meals[id];
 editing={id,k,items:JSON.parse(JSON.stringify(m.items))};
 const sections=t.groups.map(g=>`
  <h3 style="margin-top:18px">${g.name}</h3>
  <div class="items">
   ${g.items.map(([food])=>{
    const obj=editing.items[food];
    const f=foods[food];
    return `<div class="item">
     <input type="checkbox" data-check="${food}" ${obj.on?"checked":""}>
     <label>${f[0]}<small>${money(foodValues(food,obj).kcal)} kcal</small></label>
     <input type="number" min="0" step="1" data-qty="${food}" value="${obj.qty}">
     <small>${f[3]}</small>
    </div>`;
   }).join("")}
  </div>`).join("");
 $("#modalContent").innerHTML=`
  <div class="modal-head">
   <h2 style="margin:0">${t.name}</h2>
   <button class="btn secondary" data-close>Fermer</button>
  </div>
  <p class="muted">Modifie les quantités puis enregistre le repas. Tu peux retirer un ingrédient en le décochant ou en mettant 0 g.</p>
  ${sections}
  <section class="panel"><b id="mealPreview"></b></section>
  <div class="actions">
   <button class="btn" id="saveMeal">Enregistrer ce repas</button>
   <button class="btn secondary" id="clearMeal">Retirer ce repas</button>
  </div>`;
 $("#modal").classList.remove("hidden");
 previewMeal();
}

function previewMeal(){
 if(!editing)return;
 const v=mealValues({active:true,items:editing.items});
 $("#mealPreview").textContent=`${money(v.kcal)} kcal · ${money(v.protein)} g de protéines`;
 document.querySelectorAll("[data-check]").forEach(el=>{
  const id=el.dataset.check;
  const label=el.closest(".item").querySelector("small");
  label.textContent=`${money(foodValues(id,editing.items[id]).kcal)} kcal`;
 });
}

function closeModal(){
 $("#modal").classList.add("hidden");
 editing=null;
 render();
}

function storeMeal(clear=false){
 const d=getDay(editing.k,true);
 const m=d.meals[editing.id];
 m.items=editing.items;
 m.active=!clear;
 d.confirmed=false;
 save();
 const k=editing.k;
 closeModal();
 if(k!==today())openDay(k);
}

function openDay(k){
 getDay(k,true);
 $("#modalContent").innerHTML=`
  <div class="modal-head">
   <h2 style="margin:0">Détail de la journée</h2>
   <button class="btn secondary" data-close>Fermer</button>
  </div>
  ${daily(k,true)}`;
 $("#modal").classList.remove("hidden");
}

function changeWeight(k,field,value){
 const d=getDay(k,true);
 d[field]=value===""?null:clamp(Number(value),20,300);
 save();
 if(k===today()&&tab==="today")render();
 else if(!$("#modal").classList.contains("hidden"))openDay(k);
 else render();
}

function updateProfile(){
 const p=state.profile;
 document.querySelectorAll("[data-profile]").forEach(el=>{
  const id=el.dataset.profile;
  if(id==="sex")p[id]=el.value;
  else if(id==="manualMaintenance")
   p[id]=el.value===""?null:Number(el.value);
  else p[id]=Number(el.value);
 });
 p.height=clamp(p.height,100,250);
 p.birthYear=clamp(p.birthYear,1900,new Date().getFullYear());
 p.weightStart=clamp(p.weightStart,20,300);
 p.goal=clamp(p.goal,20,300);
 p.nextGoal=clamp(p.nextGoal,20,300);
 p.proteinPerKg=clamp(p.proteinPerKg,1,3);
 const k=today();
 state.settingsHistory=state.settingsHistory.filter(x=>x.from!==k);
 state.settingsHistory.push({
  from:k,maintenance:maintenance(),surplus:p.surplus
 });
 const d=getDay(k);
 if(d)d.thresholds={maintenance:maintenance(),surplus:p.surplus};
 save();
 render();
 alert("Profil enregistré. Les anciens seuils sont conservés.");
}

function changeMonth(n){
 const [y,m]=month.split("-").map(Number);
 const d=new Date(y,m-1+n,1);
 month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
 render();
}

function exportData(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="mes-calories-"+today()+".json";
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

document.addEventListener("click",e=>{
 const b=e.target.closest("button");
 if(!b)return;
 if(b.dataset.tab){
  tab=b.dataset.tab;render();
 }else if(b.dataset.edit){
  openMeal(b.dataset.edit,b.dataset.key);
 }else if(b.dataset.close!==undefined){
  closeModal();
 }else if(b.dataset.month){
  changeMonth(Number(b.dataset.month));
 }else if(b.dataset.date){
  openDay(b.dataset.date);
 }else if(b.dataset.confirm){
  const k=b.dataset.confirm;
  const d=getDay(k,true);
  d.confirmed=true;
  d.excluded=false;
  save();
  if(!$("#modal").classList.contains("hidden"))openDay(k);
  else render();
 }else if(b.dataset.exclude){
  const k=b.dataset.exclude;
  const d=getDay(k,true);
  d.excluded=!d.excluded;
  if(d.excluded)d.confirmed=false;
  save();
  if(!$("#modal").classList.contains("hidden"))openDay(k);
  else render();
 }else if(b.id==="saveMeal"){
  storeMeal();
 }else if(b.id==="clearMeal"){
  storeMeal(true);
 }else if(b.id==="saveProfile"){
  updateProfile();
 }else if(b.id==="export"){
  exportData();
 }else if(b.id==="nextGoal"){
  const p=state.profile;
  if(confirm(`Passer de ${p.goal} kg à ${p.nextGoal} kg ?`)){
   p.goal=p.nextGoal;
   p.nextGoal=p.goal+5;
   save();render();
  }
 }
});

document.addEventListener("input",e=>{
 const el=e.target;
 if(el.dataset.qty&&editing){
  const obj=editing.items[el.dataset.qty];
  obj.qty=Math.max(0,Number(el.value)||0);
  obj.on=obj.qty>0;
  const check=document.querySelector(`[data-check="${el.dataset.qty}"]`);
  if(check)check.checked=obj.on;
  previewMeal();
 }
});

document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.check&&editing){
  editing.items[el.dataset.check].on=el.checked;
  previewMeal();
 }else if(el.dataset.weight){
  changeWeight(el.dataset.key,el.dataset.weight,el.value);
 }else if(el.id==="import"){
  const file=el.files?.[0];
  if(!file)return;
  file.text().then(txt=>{
   const data=JSON.parse(txt);
   if(!data.days||!data.profile)throw Error("Format invalide");
   if(confirm("Remplacer les données actuelles ?")){
    state=data;
    state.profile={...defaults,...state.profile};
    state.settingsHistory=state.settingsHistory||[];
    save();render();
   }
  }).catch(()=>alert("Fichier JSON invalide."));
 }
});

$("#modal").addEventListener("click",e=>{
 if(e.target.id==="modal")closeModal();
});

render();
setInterval(()=>{
 if(tab==="today"&&$("#modal").classList.contains("hidden"))render();
},60000);

})();
</script>
</body>
</html>
